name: PR Preview

# Gives every pull request its own running stack:
#   * an isolated Neon database branch (copy-on-write from main — instant, no data copying)
#   * API + web containers on the deployment VPS
#   * a comment on the PR with the URLs
#
# Torn down by pr-cleanup.yml when the PR closes.
#
# Until the VPS secrets exist, the deploy job is skipped and the workflow still
# does everything useful: creates the branch, builds and publishes the images,
# and comments what *would* have been deployed. See README "PR previews".

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write        # push images to GHCR
  pull-requests: write   # post the preview comment

env:
  REGISTRY: ghcr.io
# IMAGE_BASE is computed in the `setup` job instead of here: Docker rejects
# uppercase repository names and `github.repository` keeps the repo's own
# capitalisation, which GitHub expressions cannot lowercase.

jobs:
  # ---------------------------------------------------------------------------
  # Ports are derived from the PR number so concurrent previews never collide,
  # and are stable across pushes so the URL in the PR comment stays valid.
  # ---------------------------------------------------------------------------
  setup:
    name: Resolve preview identity
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.ids.outputs.pr }}
      image_base: ${{ steps.ids.outputs.image_base }}
      tag: ${{ steps.ids.outputs.tag }}
      branch: ${{ steps.ids.outputs.branch }}
      web_port: ${{ steps.ids.outputs.web_port }}
      api_port: ${{ steps.ids.outputs.api_port }}
      web_url: ${{ steps.ids.outputs.web_url }}
      api_url: ${{ steps.ids.outputs.api_url }}
      can_deploy: ${{ steps.ids.outputs.can_deploy }}
    steps:
      - id: ids
        env:
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HOST: ${{ vars.PREVIEW_HOST }}
          HAS_SSH: ${{ secrets.DEPLOY_SSH_KEY != '' }}
        run: |
          # 30000+N and 40000+N stay inside the ephemeral-safe range and are
          # trivially predictable, which matters for the cleanup job.
          WEB_PORT=$((30000 + PR))
          API_PORT=$((40000 + PR))
          {
            echo "image_base=ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
            echo "pr=$PR"
            echo "tag=pr-$PR"
            echo "branch=preview/pr-$PR"
            echo "web_port=$WEB_PORT"
            echo "api_port=$API_PORT"
            echo "web_url=http://${HOST:-PREVIEW_HOST-not-set}:$WEB_PORT"
            echo "api_url=http://${HOST:-PREVIEW_HOST-not-set}:$API_PORT"
            echo "can_deploy=$([ -n "$HOST" ] && [ "$HAS_SSH" = "true" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Neon branch: copy-on-write from the parent, so the preview starts with real
  # data instantly and writes never touch production.
  # ---------------------------------------------------------------------------
  database:
    name: Neon branch
    needs: setup
    runs-on: ubuntu-latest
    # Forks cannot read secrets; skip rather than fail with a confusing error.
    if: github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      db_url: ${{ steps.branch.outputs.db_url_pooled }}
    steps:
      - uses: actions/checkout@v4

      - name: Create or reset the branch for this PR
        id: branch
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ needs.setup.outputs.branch }}
          # Copy-on-write from your default branch, so the preview has data.
          parent: ${{ vars.NEON_PARENT_BRANCH || 'main' }}
          username: ${{ vars.NEON_DB_USER || 'neondb_owner' }}
          database: ${{ vars.NEON_DB_NAME || 'neondb' }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply schema to the branch
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url_pooled }}
        run: |
          python -m pip install -e ".[api]"
          # Idempotent: the branch inherits the parent's tables, so this only
          # adds anything when the schema changed in this PR.
          python -m loader.check --init

  # ---------------------------------------------------------------------------
  # Images. The web bundle inlines VITE_API_BASE at build time, so it must be
  # rebuilt per PR with that PR's API URL — it cannot be overridden at runtime.
  # ---------------------------------------------------------------------------
  images:
    name: Build and publish images
    needs: setup
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ needs.setup.outputs.image_base }}/api:${{ needs.setup.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: ${{ needs.setup.outputs.image_base }}/web:${{ needs.setup.outputs.tag }}
          build-args: |
            VITE_API_BASE=${{ needs.setup.outputs.api_url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy. Skipped until PREVIEW_HOST and DEPLOY_SSH_KEY exist, so the rest of
  # the pipeline is usable before the server is provisioned.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy preview
    needs: [setup, database, images]
    runs-on: ubuntu-latest
    if: needs.setup.outputs.can_deploy == 'true'
    environment:
      name: preview-pr-${{ needs.setup.outputs.pr }}
      url: ${{ needs.setup.outputs.web_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.PREVIEW_HOST }}
          username: ${{ vars.DEPLOY_USER || 'deploy' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.preview.yml
          target: ~/mios-previews/pr-${{ needs.setup.outputs.pr }}/

      - name: Start the stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          TAG: ${{ needs.setup.outputs.tag }}
        with:
          host: ${{ vars.PREVIEW_HOST }}
          username: ${{ vars.DEPLOY_USER || 'deploy' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: TAG
          script: |
            set -euo pipefail
            cd ~/mios-previews/pr-${{ needs.setup.outputs.pr }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            cat > .env <<'ENVEOF'
            API_IMAGE=${{ needs.setup.outputs.image_base }}/api:${{ needs.setup.outputs.tag }}
            WEB_IMAGE=${{ needs.setup.outputs.image_base }}/web:${{ needs.setup.outputs.tag }}
            DATABASE_URL=${{ needs.database.outputs.db_url }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            WEB_APP_URL=${{ needs.setup.outputs.web_url }}
            API_BASE_URL=${{ needs.setup.outputs.api_url }}
            WEB_PORT=${{ needs.setup.outputs.web_port }}
            API_PORT=${{ needs.setup.outputs.api_port }}
            AUTH_DISABLED=true
            ENVEOF
            chmod 600 .env

            docker compose -p mios-pr-${{ needs.setup.outputs.pr }} \
              -f docker-compose.preview.yml pull
            docker compose -p mios-pr-${{ needs.setup.outputs.pr }} \
              -f docker-compose.preview.yml up -d --remove-orphans
            docker image prune -f

  # ---------------------------------------------------------------------------
  comment:
    name: Comment on PR
    needs: [setup, database, images, deploy]
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const s = ${{ toJSON(needs.setup.outputs) }};
            const deployed = '${{ needs.deploy.result }}' === 'success';
            const pending = '${{ needs.setup.outputs.can_deploy }}' !== 'true';

            const body = [
              '### MIOS preview — PR #' + s.pr,
              '',
              pending
                ? '⏳ **Deployment server not configured yet.** Images and the Neon branch are ready; set `PREVIEW_HOST` and `DEPLOY_SSH_KEY` to enable deploys (see README).'
                : deployed
                  ? '✅ Preview is live.'
                  : '❌ Deploy failed — check the workflow logs.',
              '',
              '| | |',
              '|---|---|',
              '| Dashboard | ' + (pending ? '`' + s.web_url + '` (pending)' : s.web_url) + ' |',
              '| API | ' + (pending ? '`' + s.api_url + '` (pending)' : s.api_url + '/api/health') + ' |',
              '| Neon branch | `' + s.branch + '` |',
              '| Images | `' + s.tag + '` |',
              '',
              '> Sign-in is **disabled** on previews — Google does not allow wildcard redirect URIs, so a per-PR hostname cannot be pre-registered. The dashboard shows a warning strip.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: Number(s.pr),
            });
            const mine = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('MIOS preview — PR #' + s.pr));

            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: mine.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: Number(s.pr), body,
              });
            }

name: CI

# Every PR and every push to main. Nothing here touches Neon, deploys anything,
# or spends Gemini quota — it is safe to run on forks.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push supersedes the in-flight run for the same branch.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest

    services:
      # A real PostgreSQL server so the dialect-parity tests actually execute.
      # Without it they skip, and the Postgres-only bugs they cover (transaction
      # abort on duplicate key, TEXT/INTEGER casting, LIKE placeholder escaping)
      # would only ever surface against Neon in production.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mios_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[api,dev]"

      - name: Run tests (SQLite + PostgreSQL)
        env:
          # Deliberately TEST_DATABASE_URL, never DATABASE_URL: the parity tests
          # truncate tables, and this must never be able to reach real Neon data.
          # sslmode=disable — the service container speaks plaintext on localhost.
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mios_test?sslmode=disable
        run: python -m pytest -q --junitxml=pytest-results.xml

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: ignore

  web:
    name: Web typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build only — proves the Dockerfiles are valid on every PR without
      # needing registry credentials, which forks don't have.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: CI

# Every PR and every push to main. Nothing here touches Neon, deploys anything,
# or spends Gemini quota — it is safe to run on forks.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push supersedes the in-flight run for the same branch.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest

    services:
      # A real PostgreSQL server so the dialect-parity tests actually execute.
      # Without it they skip, and the Postgres-only bugs they cover (transaction
      # abort on duplicate key, TEXT/INTEGER casting, LIKE placeholder escaping)
      # would only ever surface against Neon in production.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mios_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[api,dev]"

      - name: Run tests (SQLite + PostgreSQL)
        env:
          # Deliberately TEST_DATABASE_URL, never DATABASE_URL: the parity tests
          # truncate tables, and this must never be able to reach real Neon data.
          # sslmode=disable — the service container speaks plaintext on localhost.
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mios_test?sslmode=disable
        run: python -m pytest -q --junitxml=pytest-results.xml

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: ignore

  web:
    name: Web typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Build BEFORE typecheck, not after. `src/routeTree.gen.ts` is generated by
      # the TanStack Router plugin during the build and is gitignored, so on a
      # fresh checkout it does not exist yet. Typechecking first fails with
      # "Cannot find module './routeTree.gen'" plus a cascade of bogus errors on
      # every createFileRoute call.
      #
      # Vite strips types with esbuild rather than typechecking, so the build
      # still succeeds on type errors — tsc below is what actually gates them.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Built and run locally, never pushed — so this works on forks, which have
      # no registry credentials.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          load: true               # keep it locally so the next step can run it
          tags: mios-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building only proves the Dockerfile parses. A package missing from the
      # COPY list builds cleanly and then fails when uvicorn imports the app —
      # which reaches the deploy as "container is unhealthy", naming neither the
      # module nor the file. This runs the image the same way production does
      # and waits for the same endpoint the container healthcheck uses.
      - name: API image starts and serves /api/health
        run: |
          docker run -d --name mios-api-ci -p 8787:8787 mios-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health > /dev/null; then
              echo "healthy after ${i}s"
              docker rm -f mios-api-ci > /dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::API image never answered /api/health"
          docker logs mios-api-ci
          docker rm -f mios-api-ci > /dev/null
          exit 1

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

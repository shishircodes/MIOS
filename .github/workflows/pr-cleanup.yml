name: PR Cleanup

# Tears down everything pr-preview.yml created. Without this, Neon branches and
# stopped containers accumulate on every merged PR until they hit project limits.
#
# Runs on close *and* merge (a merged PR emits `closed` too).

on:
  pull_request:
    types: [closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false   # never abandon a teardown half-done

permissions:
  contents: read
  pull-requests: write

jobs:
  cleanup:
    name: Remove preview
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # The `secrets` context is not available in an `if:` expression, so the
      # presence check happens in a step (where it *is* allowed in `env:`) and
      # is surfaced as an output.
      - name: Is a deployment server configured?
        id: cfg
        env:
          HOST: ${{ vars.PREVIEW_HOST }}
          HAS_SSH: ${{ secrets.DEPLOY_SSH_KEY != '' }}
        run: |
          if [ -n "$HOST" ] && [ "$HAS_SSH" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No deployment server configured; skipping container teardown."
          fi

      - name: Stop the stack on the server
        # Best-effort: if the deploy never happened there is nothing to remove,
        # which must not fail the job and leave the Neon branch orphaned.
        if: steps.cfg.outputs.configured == 'true'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.PREVIEW_HOST }}
          username: ${{ vars.DEPLOY_USER || 'deploy' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -uo pipefail
            PR=${{ github.event.pull_request.number }}
            DIR=~/mios-previews/pr-$PR
            if [ -d "$DIR" ]; then
              cd "$DIR"
              docker compose -p mios-pr-$PR -f docker-compose.preview.yml down --volumes --remove-orphans || true
              cd ~
              rm -rf "$DIR"
              echo "removed preview stack for PR $PR"
            else
              echo "no preview stack for PR $PR; nothing to remove"
            fi
            docker image prune -af --filter "until=168h" || true

      - name: Delete the Neon branch
        continue-on-error: true
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Note the teardown on the PR
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: pr,
            });
            const mine = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('MIOS preview — PR #' + pr));
            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: mine.id,
                body: '### MIOS preview — PR #' + pr + '\n\n🧹 Torn down. Neon branch `preview/pr-' +
                      pr + '` deleted and preview containers removed.',
              });
            }

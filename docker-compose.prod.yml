# Production stack for the Hetzner VPS.
#
#   docker compose -p mios -f docker-compose.prod.yml up -d
#
# Deployed by .github/workflows/deploy-main.yml on every push to main. Values
# come from the .env file that workflow writes next to this one.
#
# TLS is NOT handled here. Both containers publish plain HTTP ports and expect
# something in front of them to terminate HTTPS — Cloudflare, an nginx on the
# host, or a load balancer. See "TLS" in the README: Google refuses OAuth
# redirect URIs that are not https, so sign-in stays broken until that exists.

name: mios

services:
  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Public URLs, as the browser sees them — i.e. whatever your TLS layer
      # presents, not the container ports below.
      WEB_APP_URL: ${WEB_APP_URL}
      API_BASE_URL: ${API_BASE_URL}
      OAUTH_REDIRECT_URI: ${API_BASE_URL}/auth/callback

      # This host is fixed (unlike per-PR previews), so its single redirect URI
      # can be registered with Google and real sign-in works.
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_MAX_AGE: ${SESSION_MAX_AGE:-43200}
      ALLOWED_GOOGLE_DOMAIN: ${ALLOWED_GOOGLE_DOMAIN:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
    ports:
      # Bind to localhost only when a proxy runs on the same host: set
      # API_BIND=127.0.0.1 so the port is not reachable from the internet.
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8787}:8787"

  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3000}:3000"

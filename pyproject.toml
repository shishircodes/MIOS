[project]
name = "mios-poc"
version = "0.1.0"
description = "MIOS Mode Monitor - Proof of Concept (Easy Skill Australia)"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.1",
    "google-genai>=0.3.0",
    "crawlee[beautifulsoup]>=0.4.0",
    "beautifulsoup4>=4.12.0",
    "rapidfuzz>=3.9.0",
    "requests>=2.32.0",
    # Neon / PostgreSQL. Binary wheel avoids needing libpq + a compiler locally.
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Google Sign-In. Authlib handles the OIDC discovery, PKCE, state/nonce and
    # ID-token (JWKS) verification - none of which should be hand-rolled.
    "authlib>=1.3.0",
    "httpx>=0.27.0",
    "itsdangerous>=2.2.0",  # signs the session cookie (Starlette SessionMiddleware)
    # Mode Push CV intake: multipart parses the upload, pypdf reads PDF CVs.
    # Word .docx needs nothing extra — push/cv_extract reads it with zipfile.
    "python-multipart>=0.0.9",
    "pypdf>=4.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "config*", "scraper*", "loader*", "agents*", "delivery*", "evaluation*",
    "api*", "pipeline*", "push*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
